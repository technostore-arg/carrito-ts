<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Ilustración genérica de un celular — imagen referencial, no es una foto del producto">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e9e9ee" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="480" fill="#f5f5f7"/>
  <rect width="640" height="480" fill="url(#grid)"/>

  <!-- Marco tipo plano -->
  <g stroke="#0071e3" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M28 68V28h40"/>
    <path d="M572 28h40v40"/>
    <path d="M612 412v40h-40"/>
    <path d="M68 452H28v-40"/>
  </g>

  <!-- Celular (esquema frontal, sin marca) -->
  <g transform="translate(112 96)">
    <rect x="0" y="0" width="176" height="304" rx="26" fill="#ffffff" stroke="#8e8e93" stroke-width="3.5"/>
    <rect x="10" y="10" width="156" height="284" rx="18" fill="#fafafb" stroke="#e8e8ed" stroke-width="1.5"/>
    <circle cx="88" cy="30" r="7" fill="#d2d2d7"/>
    <rect x="30" y="60" width="116" height="64" rx="10" fill="#e8e8ed"/>
    <rect x="30" y="140" width="84" height="12" rx="6" fill="#e8e8ed"/>
    <rect x="30" y="162" width="116" height="12" rx="6" fill="#ececf0"/>
    <rect x="30" y="192" width="54" height="52" rx="10" fill="#e8e8ed"/>
    <rect x="92" y="192" width="54" height="52" rx="10" fill="#e8e8ed"/>
    <rect x="52" y="262" width="72" height="20" rx="10" fill="#0071e3" opacity="0.85"/>
    <rect x="174" y="84" width="5" height="36" rx="2.5" fill="#a1a1a6"/>
    <rect x="174" y="130" width="5" height="20" rx="2.5" fill="#a1a1a6"/>
    <rect x="-3" y="94" width="5" height="48" rx="2.5" fill="#a1a1a6"/>
  </g>

  <!-- Cota superior (estilo plano técnico) -->
  <g stroke="#a1a1a6" stroke-width="1.5" fill="none">
    <path d="M112 74h176" stroke-dasharray="7 7"/>
    <path d="M112 68v12M288 68v12"/>
  </g>
  <!-- Crucetas de encuadre -->
  <g stroke="#a1a1a6" stroke-width="1.5" opacity="0.7">
    <path d="M86 96h14M93 89v14"/>
    <path d="M300 96h14M307 89v14"/>
    <path d="M86 400h14M93 393v14"/>
    <path d="M300 400h14M307 393v14"/>
  </g>

  <!-- Texto -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="352" y="132" width="220" height="38" rx="19" fill="#f0f7ff" stroke="#0071e3" stroke-width="2"/>
    <text x="462" y="157" text-anchor="middle" fill="#0071e3" font-size="17" font-weight="700" letter-spacing="1.6">IMAGEN GENÉRICA</text>

    <text x="352" y="228" fill="#48484d" font-size="36" font-weight="800">Esquema</text>
    <text x="352" y="272" fill="#0071e3" font-size="36" font-weight="800">ilustrativo</text>

    <text x="352" y="318" fill="#8e8e93" font-size="17">La foto real del producto</text>
    <text x="352" y="342" fill="#8e8e93" font-size="17">se publica próximamente.</text>

    <g stroke="#a1a1a6" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M352 372h200" stroke-dasharray="5 6"/>
    </g>
    <text x="352" y="398" fill="#a1a1a6" font-size="14" letter-spacing="0.5">Referencia visual — no corresponde</text>
    <text x="352" y="418" fill="#a1a1a6" font-size="14" letter-spacing="0.5">a ningún modelo en particular.</text>
  </g>
</svg>
