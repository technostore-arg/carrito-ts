<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechnoStore · Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b101c; --panel: #111827; --border: rgba(148,163,184,.15);
      --text: #e5edf8; --muted: #94a3b8; --cyan: #22d3ee; --indigo: #6366f1;
      --green: #34d399; --amber: #fbbf24; --red: #f87171;
      --grad: linear-gradient(135deg,#06b6d4,#6366f1 60%,#a855f7);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text);
      min-height:100vh; line-height:1.55;
    }
    button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
    input, select { font-family:inherit; }

    .login-wrap { display:grid; place-items:center; min-height:100vh; }
    .login-card {
      width:min(380px,92vw); background:var(--panel); border:1px solid var(--border);
      border-radius:20px; padding:34px; text-align:center;
    }
    .logo-mark { display:inline-grid; place-items:center; width:52px; height:52px;
      border-radius:16px; background:var(--grad); font-size:1.6rem; margin-bottom:14px; }
    .login-card h1 { font-size:1.35rem; margin-bottom:4px; }
    .login-card p { color:var(--muted); font-size:.88rem; margin-bottom:22px; }
    .login-card input {
      width:100%; padding:12px 15px; border-radius:11px; border:1px solid var(--border);
      background:#0d1322; color:var(--text); font-size:.95rem; margin-bottom:14px;
    }
    .btn-grad {
      width:100%; padding:13px; border-radius:12px; background:var(--grad);
      color:#fff; font-weight:700; font-size:.95rem;
    }
    .error-msg { color:var(--red); font-size:.85rem; margin-top:10px; min-height:1.2em; }

    header.topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 26px; border-bottom:1px solid var(--border);
      background:#0d1424; position:sticky; top:0; z-index:10;
    }
    .brand { font-weight:900; font-size:1.1rem; letter-spacing:-.5px; display:flex; gap:9px; align-items:center; }
    .brand span.mk { display:grid; place-items:center; width:32px; height:32px; border-radius:10px; background:var(--grad); font-size:.95rem; }
    .top-actions { display:flex; gap:10px; align-items:center; }
    .top-actions a { color:var(--muted); text-decoration:none; font-size:.87rem; }
    .top-actions a:hover { color:var(--cyan); }
    .logout-btn { padding:8px 16px; border-radius:999px; border:1px solid var(--border);
      font-size:.83rem; color:var(--muted); }
    .logout-btn:hover { border-color:var(--red); color:var(--red); }

    nav.tabs { display:flex; gap:10px; padding:18px 26px 0; max-width:1150px; margin:0 auto; }
    nav.tabs button {
      padding:10px 22px; border-radius:999px; border:1px solid var(--border);
      color:var(--muted); font-weight:600; font-size:.92rem; background:var(--panel);
    }
    nav.tabs button.active { background:var(--grad); border-color:transparent; color:#fff; }

    main { max-width:1150px; margin:0 auto; padding:22px 26px 60px; }

    .stats { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
    .stat {
      flex:1; min-width:150px; background:var(--panel); border:1px solid var(--border);
      border-radius:14px; padding:16px 18px;
    }
    .stat b { font-size:1.45rem; display:block; }
    .stat small { color:var(--muted); font-size:.78rem; }

    .card {
      background:var(--panel); border:1px solid var(--border); border-radius:16px;
      padding:18px; margin-bottom:16px;
    }

    table { width:100%; border-collapse:collapse; font-size:.88rem; }
    th { text-align:left; color:var(--muted); font-size:.74rem; text-transform:uppercase;
      letter-spacing:1px; padding:9px 10px; border-bottom:1px solid var(--border); }
    td { padding:11px 10px; border-bottom:1px solid rgba(148,163,184,.07); vertical-align:top; }
    tr:last-child td { border-bottom:none; }

    .order-code { font-family:monospace; color:var(--cyan); font-weight:700; }
    .order-items { color:var(--muted); font-size:.8rem; margin-top:3px; }
    .status-select {
      padding:6px 10px; border-radius:8px; border:1px solid var(--border);
      background:#0d1322; color:var(--text); font-size:.82rem;
    }
    .badge-status { display:inline-block; padding:3px 10px; border-radius:999px;
      font-size:.72rem; font-weight:700; }
    .st-pendiente { background:rgba(251,191,36,.15); color:var(--amber); }
    .st-pagado { background:rgba(34,211,238,.15); color:var(--cyan); }
    .st-enviado { background:rgba(99,102,241,.18); color:#a5b4fc; }
    .st-entregado { background:rgba(52,211,153,.15); color:var(--green); }
    .st-cancelado { background:rgba(248,113,113,.15); color:var(--red); }

    .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
    .form-grid label { display:block; font-size:.76rem; color:var(--muted); margin-bottom:5px; font-weight:600; }
    .form-grid input, .form-grid select {
      width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--border);
      background:#0d1322; color:var(--text); font-size:.88rem;
    }
    .full { grid-column:1/-1; }
    .row-actions { display:flex; gap:8px; }
    .mini-btn { padding:6px 13px; border-radius:8px; border:1px solid var(--border); font-size:.78rem; }
    .mini-btn:hover { border-color:var(--cyan); color:var(--cyan); }
    .mini-btn.danger:hover { border-color:var(--red); color:var(--red); }

    .empty { text-align:center; color:var(--muted); padding:40px 0; }
    .toast-admin {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      background:#06231c; border:1px solid rgba(52,211,153,.5); color:#d1fae5;
      padding:11px 22px; border-radius:999px; font-size:.88rem; z-index:50;
    }
    @media (max-width:720px) {
      td.hide-sm, th.hide-sm { display:none; }
      main, header.topbar, nav.tabs { padding-left:16px; padding-right:16px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    const API = ''
    let token = sessionStorage.getItem('tn_token') || ''
    let tab = 'orders'
    let products = []
    let orders = []

    const app = document.getElementById('app')
    const h = String.raw

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(opts.headers || {}),
        },
      })
      if (res.status === 401 && token) {
        sessionStorage.removeItem('tn_token')
        token = ''
        render()
      }
      const data = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(data.error || `Error ${res.status}`)
      return data
    }

    /* ---------- Login ---------- */
    function renderLogin() {
      app.innerHTML = h`
        <div class="login-wrap">
          <div class="login-card">
            <span class="logo-mark">⚡</span>
            <h1>TechnoStore <span style="background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent">Admin</span></h1>
            <p>Panel de gestión de pedidos y productos</p>
            <form id="login-form">
              <input id="pw" type="password" placeholder="Contraseña de administrador" required autofocus />
              <button class="btn-grad" type="submit">Ingresar</button>
              <div class="error-msg" id="err"></div>
            </form>
          </div>
        </div>`
      document.getElementById('login-form').onsubmit = async e => {
        e.preventDefault()
        try {
          const data = await api('/api/admin/login', {
            method: 'POST',
            body: JSON.stringify({ password: document.getElementById('pw').value }),
          })
          token = data.token
          sessionStorage.setItem('tn_token', token)
          await loadAll()
          render()
        } catch (err) {
          document.getElementById('err').textContent = err.message
        }
      }
    }

    /* ---------- Data ---------- */
    async function loadAll() {
      ;[products, orders] = await Promise.all([api('/api/products'), api('/api/orders')])
    }

    function refresh() {
      loadAll().then(render).catch(alert)
    }

    /* ---------- Shell ---------- */
    function shell(content) {
      app.innerHTML = h`
        <header class="topbar">
          <div class="brand"><span class="mk">🧠</span> TechnoStore Admin</div>
          <div class="top-actions">
            <a href="/" target="_blank">Ver tienda ↗</a>
            <button class="logout-btn" id="logout">Salir</button>
          </div>
        </header>
        <nav class="tabs">
          <button data-tab="orders" class="${tab === 'orders' ? 'active' : ''}">📋 Pedidos (${orders.length})</button>
          <button data-tab="products" class="${tab === 'products' ? 'active' : ''}">📦 Productos (${products.length})</button>
          <button data-tab="new" class="${tab === 'new' ? 'active' : ''}">➕ Nuevo producto</button>
        </nav>
        <main>${content}</main>`
      document.getElementById('logout').onclick = () => {
        sessionStorage.removeItem('tn_token'); token = ''; render()
      }
      app.querySelectorAll('nav.tabs button').forEach(b => {
        b.onclick = () => { tab = b.dataset.tab; render() }
      })
    }

    /* ---------- Pedidos ---------- */
    const money = n => '$' + Number(n).toLocaleString('es-AR', { maximumFractionDigits: 0 })

    /* ---------- Productos ---------- */
    function viewProducts() {
      const rows = products.map(p => h`
        <tr>
          <td style="font-size:1.4rem">${p.emoji}</td>
          <td><b>${esc(p.name)}</b><div class="order-items">${esc(p.brand)} · ${p.category}</div></td>
          <td>
            <input class="status-select" style="width:95px" type="number" step="0.01"
              value="${p.price}" data-field="price" data-id="${p.id}" />
          </td>
          <td>
            <input class="status-select" style="width:70px" type="number"
              value="${p.stock}" data-field="stock" data-id="${p.id}" />
          </td>
          <td class="hide-sm">${p.rating.toFixed(1)}★ <span class="order-items">(${p.reviews})</span></td>
          <td>
            <div class="row-actions">
              <button class="mini-btn save-btn" data-id="${p.id}">Guardar</button>
              <button class="mini-btn danger del-btn" data-id="${p.id}" data-name="${esc(p.name)}">Eliminar</button>
            </div>
          </td>
        </tr>`).join('')

      return `
        <div class="card">
          ${products.length === 0
            ? '<div class="empty">No hay productos cargados</div>'
            : `<table>
                <thead><tr><th></th><th>Producto</th><th>Precio USD</th><th>Stock</th><th class="hide-sm">Rating</th><th>Acciones</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>`}
        </div>`
    }

    /* ---------- Nuevo producto ---------- */
    function viewNew() {
      return `
        <div class="card">
          <h3 style="margin-bottom:16px">➕ Cargar nuevo producto</h3>
          <form id="new-form" class="form-grid">
            <div class="full"><label>Nombre *</label><input name="name" required minlength="3" placeholder="Notebook Ultra 15" /></div>
            <div><label>Marca</label><input name="brand" placeholder="Zenlite" /></div>
            <div><label>Categoría *</label>
              <select name="category" required>
                <option value="computadoras">Computadoras</option>
                <option value="notebooks">Notebooks</option>
                <option value="celulares">Celulares</option>
                <option value="accesorios">Accesorios</option>
              </select>
            </div>
            <div><label>Precio USD *</label><input name="price" type="number" step="0.01" required placeholder="799" /></div>
            <div><label>Precio anterior (oferta)</label><input name="oldPrice" type="number" step="0.01" placeholder="899" /></div>
            <div><label>Stock *</label><input name="stock" type="number" required value="10" /></div>
            <div><label>Badge / etiqueta</label><input name="badge" placeholder="Oferta" /></div>
            <div><label>Emoji</label><input name="emoji" maxlength="4" placeholder="💻" /></div>
            <div class="full"><label>Especificaciones (una por línea)</label>
              <textarea name="specs" rows="3" style="width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:#0d1322;color:var(--text);font-family:inherit;font-size:.88rem" placeholder="Ryzen 5&#10;16GB RAM&#10;512GB SSD"></textarea>
            </div>
            <div class="full"><button class="btn-grad" type="submit" style="width:auto;padding:12px 30px">Guardar producto</button>
              <span class="error-msg" id="err-new" style="display:inline-block;margin-left:14px"></span>
            </div>
          </form>
        </div>`
    }

    /* ---------- Eventos delegados ---------- */
    function bindEvents() {
      app.querySelectorAll('.status-select[data-id]').forEach(sel => {
        sel.onchange = async () => {
          await api(`/api/orders/${sel.dataset.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: sel.value }),
          })
          toast(`Pedido actualizado a "${sel.value}"`)
          refresh()
        }
      })

      app.querySelectorAll('.save-btn').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id
          const price = app.querySelector(`input[data-id="${id}"][data-field="price"]`).value
          const stock = app.querySelector(`input[data-id="${id}"][data-field="stock"]`).value
          await api(`/api/products/${id}`, {
            method: 'PUT',
            body: JSON.stringify({ price: Number(price), stock: Number(stock) }),
          })
          toast('Producto actualizado')
          refresh()
        }
      })

      app.querySelectorAll('.del-btn').forEach(btn => {
        btn.onclick = async () => {
          if (!confirm(`¿Eliminar "${btn.dataset.name}"?`)) return
          await api(`/api/products/${btn.dataset.id}`, { method: 'DELETE' })
          toast('Producto eliminado')
          refresh()
        }
      })

      const form = document.getElementById('new-form')
      if (form) {
        form.onsubmit = async e => {
          e.preventDefault()
          const fd = new FormData(form)
          try {
            await api('/api/products', {
              method: 'POST',
              body: JSON.stringify({
                name: fd.get('name'),
                brand: fd.get('brand'),
                category: fd.get('category'),
                price: Number(fd.get('price')),
                oldPrice: fd.get('oldPrice') ? Number(fd.get('oldPrice')) : null,
                stock: Number(fd.get('stock')),
                badge: fd.get('badge') || null,
                emoji: fd.get('emoji') || '📦',
                specs: String(fd.get('specs')).split('\n').map(s => s.trim()).filter(Boolean),
              }),
            })
            form.reset()
            toast('Producto creado ✅')
            tab = 'products'
            refresh()
          } catch (err) {
            document.getElementById('err-new').textContent = err.message
          }
        }
      }
    }

    let toastTimer
    function toast(msg) {
      document.querySelector('.toast-admin')?.remove()
      const t = document.createElement('div')
      t.className = 'toast-admin'
      t.textContent = msg
      document.body.appendChild(t)
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => t.remove(), 2600)
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    }

    /* ---------- Render principal ---------- */
    function render() {
      if (!token) return renderLogin()
      if (tab === 'orders') {
        const stats = {
          total: orders.length,
          pendiente: orders.filter(o => o.status === 'pendiente').length,
          ingresos: orders.filter(o => o.status !== 'cancelado').reduce((s, o) => s + o.total, 0),
        }
        const rows = orders.map(o => `
          <tr>
            <td><span class="order-code">${esc(o.code)}</span><div class="order-items">${o.items.length} ítem(s)</div></td>
            <td><b>${esc(o.customer_name)}</b><div class="order-items">${esc(o.email)}<br>${esc(o.city)} — ${esc(o.address)}</div></td>
            <td class="hide-sm">${o.items.map(i => `<div>${i.emoji} ${esc(i.name)} ×${i.qty}</div>`).join('')}</td>
            <td><b>${money(o.total)}</b><div class="order-items">${esc(o.payment_method)}</div></td>
            <td><span class="badge-status st-${o.status}">${o.status}</span></td>
            <td class="hide-sm">${new Date(o.created_at + 'Z').toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' })}</td>
            <td>
              <select class="status-select" data-id="${o.id}">
                ${['pendiente','pagado','enviado','entregado','cancelado'].map(s =>
                  `<option value="${s}" ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </td>
          </tr>`).join('')
        const tableHtml = orders.length === 0
          ? '<div class="empty">Todavía no hay pedidos 🛒</div>'
          : `<table>
              <thead><tr><th>Orden</th><th>Cliente</th><th class="hide-sm">Productos</th><th>Total</th><th>Estado</th><th class="hide-sm">Fecha</th><th>Cambiar a</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>`
        shell(`
          <div class="stats">
            <div class="stat"><small>Pedidos totales</small><b>${stats.total}</b></div>
            <div class="stat"><small>Pendientes</small><b style="color:var(--amber)">${stats.pendiente}</b></div>
            <div class="stat"><small>Ingresos</small><b style="color:var(--green)">${money(stats.ingresos)}</b></div>
          </div>
          <div class="card">${tableHtml}</div>`)
      } else if (tab === 'products') {
        shell(viewProducts())
      } else {
        shell(viewNew())
      }
      bindEvents()
    }

    async function init() {
      if (!token) return renderLogin()
      try {
        await loadAll()
        render()
      } catch {
        renderLogin()
      }
    }
    init()
  </script>
</body>
</html>
